server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind Dokploy's Traefik: keep redirects relative so /scenarier -> /scenarier/
  # never leaks the container's host/port.
  absolute_redirect off;
  port_in_redirect off;

  # Content-hashed SvelteKit assets: cache forever.
  # Embeds (makroskop-64y) may run in sandboxed iframes: WordPress wraps discovered oEmbed iframes
  # in sandbox="allow-scripts", which gives the page an opaque origin, so its own scripts and data
  # are cross-origin requests. The site is public and cookie-free: allow every origin.
  # (add_header is not inherited into a location that sets its own, hence both blocks.)
  location /_app/immutable/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*";
  }

  # Model data + prerendered pages: always revalidate, so a redeploy is picked up
  # immediately and a stale shell never requests asset hashes that no longer exist.
  location / {
    add_header Cache-Control "no-cache";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri $uri/ =404;
  }

  # Open-data CSVs (makroskop-gko): nginx's stock mime.types has no csv, so they went out as
  # application/octet-stream and skipped gzip (alle-scenarier.csv is ~20 MB). `types` here replaces
  # the map for this location only; the headers repeat because add_header is not inherited.
  location ~* \.csv$ {
    types { }
    default_type text/csv;
    charset utf-8;
    charset_types text/csv;
    add_header Cache-Control "no-cache";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }

  gzip on;
  gzip_vary on;
  gzip_types text/css text/csv application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
